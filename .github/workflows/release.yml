name: Release

# Push a tag like v0.2.0 (or run this workflow by hand) to publish a GitHub
# Release with the Windows installer and portable executables attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop app and installer
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Build headless server
        run: cargo build --release -p apex-server
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Copy-Item target/release/apex-overlays.exe dist/ApexOverlays-portable.exe
          Copy-Item target/release/apex-server.exe dist/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: Apex Overlays ${{ github.ref_type == 'tag' && github.ref_name || format('build {0}', github.run_number) }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: dist/*
          body: |
            **Install:** download `Apex Overlays_*_x64-setup.exe` and run it. Windows SmartScreen may warn because the app is not code-signed yet — click *More info → Run anyway*.
            **Portable:** `ApexOverlays-portable.exe` runs without installing (needs WebView2, included with Windows 10/11).
            **Streaming PC / OBS only:** `apex-server.exe`.
