name: Release

# Push a tag like v0.3.0, or run this workflow by hand with a version, to
# publish a GitHub Release with the Windows installer and executables attached.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to publish (e.g. v0.3.0). The tag is created on the selected branch.
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build desktop app and installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          # Signs the installer for in-app updates. Add the private key as a repository
          # secret named TAURI_SIGNING_PRIVATE_KEY (see docs/UPDATES.md).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            npx --yes @tauri-apps/cli@2 build
          } else {
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY is not set: building without in-app update files"
            npx --yes @tauri-apps/cli@2 build --config updater-off.json
          }
      - name: Build headless server
        run: cargo build --release -p apex-overlays-server
      - name: Collect files and update manifest
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $version = (Get-Content apps/desktop/tauri.conf.json | ConvertFrom-Json).version
          # Predictable asset names (GitHub replaces spaces in file names).
          $name = "Apex-Overlays_${version}_x64-setup.exe"
          Copy-Item $setup.FullName "dist/$name"
          # Tauri names the main binary after mainBinaryName; fall back to the cargo name.
          if (Test-Path 'target/release/Apex Overlays.exe') { Copy-Item 'target/release/Apex Overlays.exe' 'dist/Apex-Overlays-portable.exe' } else { Copy-Item target/release/apex-overlays.exe dist/Apex-Overlays-portable.exe }
          Copy-Item target/release/apex-overlays-server.exe dist/
          $sig = "$($setup.FullName).sig"
          if ((Test-Path $sig) -and $env:TAG) {
            $manifest = @{
              version = $version
              notes = "Apex Overlays $env:TAG"
              pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
              platforms = @{
                "windows-x86_64" = @{
                  signature = (Get-Content $sig -Raw).Trim()
                  url = "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$name"
                }
              }
            }
            $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM dist/latest.json
          }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || format('build-{0}', github.run_number) }}
          name: Apex Overlays ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || format('build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' && inputs.tag == '' }}
          files: dist/*
          body: |
            **Install:** download `Apex-Overlays_*_x64-setup.exe` and run it. Already installed? The app offers the update itself (Settings → General → Updates). Windows SmartScreen may warn because the app is not code-signed yet — click *More info → Run anyway*.
            **Portable:** `Apex-Overlays-portable.exe` runs without installing (needs WebView2, included with Windows 10/11).
            **Streaming PC / OBS only:** `apex-overlays-server.exe`.
