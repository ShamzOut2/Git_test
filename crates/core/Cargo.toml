[package]
name = "apex-core"
description = "Telemetry engine, calculators and overlay server for Apex Overlays"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
apex-irsdk.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
rust-embed = "8"
sha2 = "0.10"
base64 = "0.22"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# Windows uses the OS TLS stack (SChannel): smaller binary, system certificates, no C toolchain.
[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", features = ["json"] }
