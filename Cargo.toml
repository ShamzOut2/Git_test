[workspace]
resolver = "2"
members = ["crates/irsdk", "crates/core", "apps/server", "apps/desktop"]
# The desktop app needs the Windows WebView2 toolchain; build it with `cargo build -p apex-overlays-desktop`.
default-members = ["crates/irsdk", "crates/core", "apps/server"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
apex-irsdk = { path = "crates/irsdk" }
apex-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
