[package]
name = "apex-desktop"
description = "Apex Overlays desktop app: transparent, click-through overlay windows on top of iRacing"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apex-overlays"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apex-core.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# ResizeDirection is only exported from the runtime crate.
tauri-runtime = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
